[project]
name = "corpus2node"
version = "0.1.0"
description = "Turn any corpus of material into an explorable, citable knowledge graph — offline LangGraph workflow + online LangChain agent."
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "python-multipart>=0.0.20",
    "pydantic>=2.10",
    "pydantic-settings>=2.7",
    "httpx[socks]>=0.28",  # socks extra: the deploy env routes through a SOCKS proxy
    # AI orchestration (LangChain 1.0 era: create_agent in langchain.agents)
    "langchain>=1.0",
    "langchain-openai>=1.0",
    "langchain-anthropic>=1.0",
    "langgraph>=1.0",
    "numpy>=1.26",      # vector math (embeddings, semantic merge)
    "networkx>=3.2",    # centrality + community detection (graph build)
    "python-docx>=1.1", # .docx ingestion
    "python-pptx>=1.0", # .pptx ingestion
    "pyyaml>=6.0",      # .yaml/.yml ingestion
]

[project.optional-dependencies]
# Heavy / external-IO deps — installed on demand (`uv sync --extra ml`)
ml = [
    "FlagEmbedding>=1.3.3",  # BGE-M3 local embeddings (pulls torch — heavy)
    "openai>=1.0,<2.0",      # Kimi PDF Files API + OpenAI-compatible embeddings
    "scikit-learn>=1.4",
]

[dependency-groups]
dev = [
    "pytest>=8.3",
    "ruff>=0.6",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/corpus2node"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.pytest.ini_options]
testpaths = ["tests"]
