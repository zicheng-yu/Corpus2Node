# Corpus2Node — single public entrypoint on :80.
# Serves the built SPA and reverse-proxies /api/* to the backend container.
server {
    listen 80;
    server_name _;

    # Uploads can be large (course PDFs, video/audio). Backend itself caps at 500 MB.
    client_max_body_size 600m;

    root /usr/share/nginx/html;
    index index.html;

    # API → backend container. The trailing slash on proxy_pass strips the /api prefix,
    # so /api/sessions reaches the backend as /sessions.
    location /api/ {
        proxy_pass http://backend:8000/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # SSE / streaming (chat, notes, exam, workflow): disable buffering, long timeouts
        # so tokens flush to the browser as they arrive.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    # SPA: serve static assets, fall back to index.html for client-side routes.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
