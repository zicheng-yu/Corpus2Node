# Corpus2Node — production stack: private backend + public nginx.
#   docker compose -f deploy/docker-compose.yml up -d --build
#
# Model credentials are NOT here — account mode stores them under
# artifacts/users/<user_id>/llm_settings.json. Everything in `environment:` is non-secret infrastructure config
# (read by pydantic-settings from the container environment; see src/corpus2node/config.py).
services:
  backend:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.backend
    environment:
      APP_ENV: production
      DEBUG_TRACEBACKS: "false"
      CORS_ALLOW_ORIGINS: ""             # same-origin via nginx; cross-origin calls disabled
      AUTH_MODE: accounts
      ACCOUNT_PRODUCT_MODE: personal
      DATABASE_URL: postgresql+asyncpg://corpus2node:${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}@postgres:5432/corpus2node
      DATABASE_AUTO_CREATE: "false"
      PUBLIC_APP_URL: ${PUBLIC_APP_URL:?Set PUBLIC_APP_URL, for example https://corpus.example.com}
      AUTH_COOKIE_SECURE: "true"
      MAX_UPLOAD_BYTES: "524288000"     # 500 MB
      EMBED_PROVIDER: hashing           # zero-dep embeddings (no torch); matches local setup
      EMBEDDING_DIMENSIONS: "1024"
      VECTOR_STORE_PROVIDER: local_cosine
      GROBID_BASE_URL: http://grobid:8070
      VISION_TIMEOUT_SECONDS: "120"
      WHISPER_MODEL_SIZE: base
      WHISPER_LANGUAGE: auto
      HF_ENDPOINT: "https://hf-mirror.com"   # China-friendly faster-whisper model download
      LANGCHAIN_TRACING: "false"
    volumes:
      - ../artifacts:/app/artifacts                 # data + per-user model settings persist on host
      - whisper-cache:/root/.cache/huggingface      # whisper model cache (downloaded on 1st audio)
    expose:
      - "8000"                                       # internal only — reachable from nginx, not the host
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true
    depends_on:
      postgres:
        condition: service_healthy
      grobid:
        condition: service_started

  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: corpus2node
      POSTGRES_USER: corpus2node
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U corpus2node -d corpus2node"]
      interval: 5s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

  grobid:
    image: grobid/grobid:0.9.0-crf
    init: true
    ulimits:
      core: 0
    expose:
      - "8070"
    restart: unless-stopped

  nginx:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.frontend
    ports:
      - "127.0.0.1:${PORT:-8080}:80"    # put a TLS reverse proxy in front for remote access
    depends_on:
      - backend
    restart: unless-stopped
    security_opt:
      - no-new-privileges:true

volumes:
  whisper-cache:
  postgres-data:
